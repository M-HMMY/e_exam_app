<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: iPhone のノッチ／ホームインジケータ領域まで描画し、CSS の safe-area で余白を取る -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="description" content="E資格の教本・確認問題・間隔反復・模試をまとめた学習アプリ" />
    <meta name="theme-color" content="#1f6feb" />

    <!-- ホーム画面に追加したときの表示（iOS / Android 共通） -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />

    <!-- フルスクリーン表示（標準の名前と、iOS 向けの従来の名前の両方を出す） -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="E資格" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />

    <title>E資格 学習アプリ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
